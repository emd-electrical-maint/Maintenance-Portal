<style>
/* ============================================================
   EMD Electrical Maintenance Portal — single-file Drive edition
   Design: industrial control-panel theme (navy + gold), same as
   the original multi-page version.
   ============================================================ */
:root {
  --color-bg: #eef1f3;
  --color-surface: #ffffff;
  --color-panel: #16324a;
  --color-panel-dark: #0d2033;
  --color-topbar-top: #eef1f5;
  --color-topbar-bottom: #d3dce4;
  --color-accent: #d98e2b;
  --color-accent-dark: #b3721e;
  --color-danger: #b83b2e;
  --color-danger-bg: #fbeae7;
  --color-success: #2f7a54;
  --color-text: #1b232b;
  --color-text-muted: #5c6b76;
  --color-border: #d7dde1;
  --color-border-strong: #b9c2c8;
  --font-display: 'Segoe UI Semibold','Segoe UI',-apple-system,system-ui,sans-serif;
  --font-body: 'Segoe UI',-apple-system,system-ui,sans-serif;
  --font-mono: 'Consolas','SF Mono','Roboto Mono',monospace;
  --radius: 4px;
  --radius-card: 14px;
  --shadow-card: 0 1px 2px rgba(13,32,51,.08), 0 1px 1px rgba(13,32,51,.04);
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); font-size:15px; line-height:1.5; }
body { min-height:100vh; display:flex; flex-direction:column; }
.page { flex:1 0 auto; max-width:1180px; margin:0 auto; padding:28px 24px 60px; width:100%; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; }

.topbar { background:linear-gradient(180deg,var(--color-topbar-top) 0%,var(--color-topbar-bottom) 100%); border-bottom:3px solid var(--color-panel); color:var(--color-panel); padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:76px; position:sticky; top:0; z-index:50; box-shadow:0 2px 8px rgba(13,32,51,.12); flex-wrap:wrap; }
.topbar-brand { display:flex; align-items:center; gap:14px; }
.sail-logo { height:52px; width:auto; display:block; flex-shrink:0; border-radius:3px; }
.topbar-mark { width:38px; height:38px; border-radius:3px; background:var(--color-accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--color-panel-dark); letter-spacing:-.5px; }
.topbar-title { display:flex; flex-direction:column; line-height:1.25; }
.topbar-title .line1 { font-size:12.5px; letter-spacing:.08em; color:#54697d; text-transform:uppercase; font-weight:600; }
.topbar-title .line2 { font-size:18.5px; font-weight:700; font-family:var(--font-display); color:var(--color-panel); }
.topbar-actions { display:flex; align-items:center; gap:14px; font-size:13.5px; }
.admin-pill { display:flex; align-items:center; gap:8px; background:rgba(22,50,74,.08); color:var(--color-panel); padding:6px 12px; border-radius:20px; font-weight:600; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--color-accent); box-shadow:0 0 0 3px rgba(217,142,43,.25); }

.btn { font-size:13.5px; font-weight:600; padding:7px 14px; border-radius:var(--radius); border:1px solid transparent; transition:background .12s ease,border-color .12s ease,transform .12s ease; }
.btn:active:not(:disabled) { transform:scale(.96); }
.btn-ghost-light { background:transparent; color:#d7e4ee; border-color:rgba(255,255,255,.25); }
.btn-ghost-light:hover { background:rgba(255,255,255,.1); }
.btn-topbar { background:transparent; color:var(--color-panel); border-color:rgba(22,50,74,.3); }
.btn-topbar:hover { background:rgba(22,50,74,.08); }
.btn-primary { background:var(--color-accent); color:#241704; }
.btn-primary:hover { background:var(--color-accent-dark); }
.btn-outline { background:var(--color-surface); color:var(--color-panel); border-color:var(--color-border-strong); }
.btn-outline:hover { border-color:var(--color-panel); }
.btn-danger { background:var(--color-danger-bg); color:var(--color-danger); border-color:#ecc9c2; }
.btn-danger:hover { background:#f6d9d3; }
.btn-station-open { background:var(--color-surface); color:var(--color-panel); border:1.5px solid var(--color-border-strong); transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease; }
.btn-station-open:hover, .station-card:hover .btn-station-open { background:var(--color-accent); color:#fff; border-color:var(--color-accent); transform:scale(1.05); }
.btn-sm { padding:5px 10px; font-size:12.5px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

.breadcrumb { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--color-text-muted); margin-bottom:18px; flex-wrap:wrap; }
.breadcrumb a:hover { color:var(--color-panel); text-decoration:underline; }
.breadcrumb .sep { color:var(--color-border-strong); }
.breadcrumb .current { color:var(--color-text); font-weight:600; }
.page-header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
.page-header h1 { font-family:var(--font-display); font-size:26px; margin:0 0 4px; letter-spacing:-.01em; }
.page-eyebrow { font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--color-text-muted); font-weight:700; margin-bottom:6px; }
.page-subtitle { color:var(--color-text-muted); font-size:14px; }
.homepage-banner { position:relative; margin-bottom:28px; border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--shadow-card); }
.homepage-banner img { display:block; width:100%; max-height:260px; object-fit:cover; }
.homepage-banner-actions { position:absolute; top:10px; right:10px; display:flex; gap:6px; }
.homepage-banner-placeholder { margin-bottom:28px; min-height:140px; }

.safety-banner { display:flex; align-items:center; justify-content:center; text-align:center; gap:14px; background:#fdf6ea; border:1px solid var(--color-border); border-left:5px solid var(--color-accent); border-radius:var(--radius-card); padding:20px 28px; margin-bottom:32px; color:var(--color-text-muted); font-size:14.5px; box-shadow:var(--shadow-card); }
.safety-banner svg { flex-shrink:0; color:var(--color-accent-dark); }
.safety-banner strong { color:var(--color-text); font-weight:700; }

.alert-stack { display:flex; flex-direction:column; gap:10px; margin-bottom:32px; }
.alert-item { display:flex; align-items:flex-start; gap:12px; background:#fff5f4; border:1px solid #f3c6c2; border-left:4px solid var(--color-danger); border-radius:var(--radius-card); padding:14px 18px; box-shadow:var(--shadow-card); }
.alert-item svg { flex-shrink:0; color:var(--color-danger); margin-top:1px; }
.alert-item-body { flex:1; min-width:0; }
.alert-item-title { font-weight:700; font-size:13.5px; color:var(--color-danger); margin-bottom:2px; }
.alert-item-message { font-size:13px; color:var(--color-text); }
.alert-dismiss { background:transparent; border:none; color:var(--color-text-muted); font-size:18px; line-height:1; padding:2px 6px; flex-shrink:0; }
.alert-dismiss:hover { color:var(--color-danger); }

.station-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; align-items:stretch; }
.station-card { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); padding:20px 20px 18px; box-shadow:var(--shadow-card); position:relative; transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s cubic-bezier(.22,1,.36,1),border-color .28s ease,background-color .28s ease; display:flex; flex-direction:column; gap:10px; height:100%; cursor:pointer; animation:card-rise-in .35s cubic-bezier(.22,1,.36,1) both; animation-delay:var(--delay, 0ms); }
@keyframes card-rise-in { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.page-enter { animation:page-fade-in .2s ease; }
@keyframes page-fade-in { from{opacity:0;} to{opacity:1;} }
.station-card:hover { border-color:var(--color-accent); transform:translateY(-7px) scale(1.02); box-shadow:0 16px 32px rgba(13,32,51,.16),0 4px 10px rgba(13,32,51,.08); background:linear-gradient(180deg,#fffaf1 0%,var(--color-surface) 55%); }
.station-tag { font-family:var(--font-mono); font-size:11px; color:var(--color-accent-dark); font-weight:700; letter-spacing:.04em; }
.station-card h3 { margin:0; font-size:16.5px; font-family:var(--font-display); line-height:1.3; }
.station-meta { font-size:12.5px; color:var(--color-text-muted); display:flex; align-items:center; gap:6px; }
.station-card-footer { margin-top:auto; display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px solid var(--color-border); }
.card-actions { display:flex; gap:6px; opacity:0; transition:opacity .12s ease; }
.station-card:hover .card-actions, .equipment-row:hover .card-actions { opacity:1; }

.equipment-list { display:flex; flex-direction:column; gap:12px; }
.equipment-row { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; box-shadow:var(--shadow-card); transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1),border-color .25s ease; cursor:pointer; animation:card-rise-in .3s cubic-bezier(.22,1,.36,1) both; animation-delay:var(--delay, 0ms); }
.equipment-row:hover { transform:translateY(-3px); border-color:var(--color-accent); box-shadow:0 10px 22px rgba(13,32,51,.12),0 3px 8px rgba(13,32,51,.06); }
.equipment-row-main { display:flex; align-items:center; gap:12px; min-width:0; }
.equipment-idx { font-family:var(--font-mono); font-size:12px; color:#fff; background:var(--color-panel); width:26px; height:26px; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.equipment-row a.equipment-name { font-weight:600; font-size:15px; }
.equipment-row a.equipment-name:hover { color:var(--color-panel); text-decoration:underline; }
.badge-vfd { display:inline-flex; align-items:center; gap:4px; margin-left:10px; padding:2px 10px; border-radius:20px; background:#e8f6ec; color:#1e6b3a; border:1px solid #bfe3c8; font-size:10.5px; font-weight:700; letter-spacing:.02em; box-shadow:0 1px 3px rgba(30,107,58,.15); vertical-align:middle; }

.add-inline-card { border:1.5px dashed var(--color-border-strong); border-radius:var(--radius-card); padding:18px; display:flex; align-items:center; justify-content:center; color:var(--color-text-muted); font-size:14px; font-weight:600; cursor:pointer; background:transparent; min-height:88px; transition:border-color .12s ease,color .12s ease; }
.add-inline-card:hover { border-color:var(--color-panel); color:var(--color-panel); }
.empty-state { text-align:center; padding:50px 20px; color:var(--color-text-muted); }
.empty-state h3 { color:var(--color-text); font-family:var(--font-display); margin-bottom:6px; }

.tabs { display:flex; gap:4px; border-bottom:1px solid var(--color-border); margin-bottom:20px; flex-wrap:wrap; }
.tab-btn { background:transparent; border:none; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--color-text-muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; transition:color .18s ease, border-color .18s ease; }
.tab-btn:hover { color:var(--color-text); }
.tab-btn.active { color:var(--color-panel); border-bottom-color:var(--color-accent); }
.tab-panel { display:none; }
.tab-panel.active { display:block; animation:panel-fade-in .22s ease; }
@keyframes panel-fade-in { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

.spec-sheet { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); box-shadow:var(--shadow-card); overflow:hidden; }
.spec-sheet-header { background:var(--color-panel); color:#fff; padding:12px 18px; font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center; }
.spec-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
.spec-cell { padding:12px 18px; border-right:1px solid var(--color-border); border-bottom:1px solid var(--color-border); }
.spec-label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--color-text-muted); font-weight:700; margin-bottom:4px; }
.spec-value { font-family:var(--font-mono); font-size:14.5px; font-weight:600; }
.spec-value.empty { color:var(--color-border-strong); font-weight:400; font-family:var(--font-body); }
.spec-cell.notes-cell { grid-column:1/-1; }
.spec-grid input, .spec-grid textarea { width:100%; font-family:var(--font-mono); font-size:14px; border:1px solid var(--color-border); border-radius:3px; padding:6px 8px; background:#fbfcfd; }
.spec-grid textarea { font-family:var(--font-body); resize:vertical; min-height:50px; }

.data-table { width:100%; border-collapse:collapse; background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--shadow-card); font-size:13.5px; }
.data-table th { background:#f4f6f7; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--color-text-muted); padding:10px 14px; border-bottom:1px solid var(--color-border); font-weight:700; }
.data-table td { padding:10px 14px; border-bottom:1px solid var(--color-border); vertical-align:top; }
.data-table tr:last-child td { border-bottom:none; }
.data-table tr:hover td { background:#fafbfc; }
.mono { font-family:var(--font-mono); }
.muted { color:var(--color-text-muted); }
.row-actions { display:flex; gap:6px; white-space:nowrap; }

.drawing-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
.drawing-card { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); padding:16px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-card); transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1),border-color .25s ease; }
.drawing-card:hover { transform:translateY(-5px); border-color:var(--color-accent); box-shadow:0 12px 26px rgba(13,32,51,.14),0 3px 8px rgba(13,32,51,.07); }
.drawing-icon { width:34px; height:34px; border-radius:3px; background:var(--color-panel); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; font-weight:700; }
.drawing-title { font-weight:600; font-size:14px; word-break:break-word; }
.drawing-sub { font-size:11.5px; color:var(--color-text-muted); }
.drawing-card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:auto; }

.modal-overlay { position:fixed; inset:0; background:rgba(13,32,51,.45); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:60px 20px; z-index:100; overflow-y:auto; animation:overlay-fade-in .18s ease; }
.modal { background:var(--color-surface); border-radius:var(--radius-card); width:100%; max-width:480px; box-shadow:0 12px 32px rgba(0,0,0,.25); animation:modal-pop-in .22s cubic-bezier(.22,1,.36,1); }
@keyframes overlay-fade-in { from{opacity:0;} to{opacity:1;} }
@keyframes modal-pop-in { from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
@media (prefers-reduced-motion: reduce) {
  .modal-overlay, .modal, .preview-modal, .tab-panel.active, .station-card, .page-enter { animation:none !important; }
}
.modal-header { padding:16px 20px; border-bottom:1px solid var(--color-border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { margin:0; font-family:var(--font-display); font-size:17px; }
.modal-close { background:none; border:none; font-size:18px; color:var(--color-text-muted); padding:4px; }
.modal-body { padding:20px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto; }
.modal-footer { padding:14px 20px; border-top:1px solid var(--color-border); display:flex; justify-content:flex-end; gap:8px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:12.5px; font-weight:600; color:var(--color-text-muted); }
.field input, .field textarea, .field select { font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--color-border-strong); border-radius:var(--radius); background:#fff; }
.field textarea { resize:vertical; min-height:60px; }
.field-row { display:flex; gap:10px; }
.field-row .field { flex:1; }
.form-error { background:var(--color-danger-bg); color:var(--color-danger); border:1px solid #ecc9c2; padding:8px 12px; border-radius:var(--radius); font-size:13px; }
.helper-text { font-size:12px; color:var(--color-text-muted); }

.preview-overlay { align-items:center; padding:30px; }
.preview-modal { background:var(--color-surface); border-radius:var(--radius-card); max-width:92vw; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 16px 40px rgba(0,0,0,.35); overflow:hidden; animation:modal-pop-in .22s cubic-bezier(.22,1,.36,1); }
.preview-modal-header { padding:12px 18px; border-bottom:1px solid var(--color-border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.preview-modal-header h3 { margin:0; font-family:var(--font-display); font-size:16px; }
.preview-modal-body { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:14px; background:#0d2033; overflow:auto; }
.preview-image { max-width:100%; max-height:80vh; object-fit:contain; display:block; border-radius:3px; }
.preview-frame { width:80vw; height:80vh; max-width:100%; border:none; background:#fff; }
.preview-unsupported { padding:40px; text-align:center; color:#cfe0ee; }
.preview-unsupported p { margin-bottom:14px; }

.login-wrap { display:flex; align-items:center; justify-content:center; padding:60px 20px; flex:1 0 auto; }
.login-card { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); padding:32px; width:100%; max-width:420px; box-shadow:var(--shadow-card); text-align:center; }
.login-card h1 { font-family:var(--font-display); font-size:20px; margin:0 0 4px; }

footer.site-footer { background:linear-gradient(180deg,var(--color-panel) 0%,var(--color-panel-dark) 100%); border-top:1px solid rgba(255,255,255,.12); color:#cfe0ee; padding:20px 20px 22px; margin-top:40px; flex-shrink:0; }
.site-footer-inner { max-width:1180px; margin:0 auto; text-align:center; font-size:12.5px; line-height:1.7; }
.site-footer-line1 { font-weight:700; font-family:var(--font-display); font-size:13.5px; color:#fff; letter-spacing:.02em; }
.site-footer-line2 { color:#b7cbdb; }
.site-footer-credit { margin-top:8px; color:#92a9bb; font-size:11.5px; }

#toast-region { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200; }
.toast { background:var(--color-panel-dark); color:#fff; padding:10px 16px; border-radius:var(--radius); font-size:13.5px; box-shadow:0 4px 12px rgba(0,0,0,.25); animation:toast-in .15s ease; max-width:320px; }
.toast.error { background:var(--color-danger); }
.toast.success { background:var(--color-success); }
@keyframes toast-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes toast-out { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(6px)} }
.toast.leaving { animation:toast-out .18s ease forwards; }

.setup-box { max-width:640px; margin:60px auto; background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-card); padding:32px; box-shadow:var(--shadow-card); }
.setup-box h1 { font-family:var(--font-display); margin-top:0; }
.setup-box code { background:#f4f6f7; padding:2px 6px; border-radius:3px; font-family:var(--font-mono); font-size:13px; }
.setup-box pre { background:#0d2033; color:#cfe0ee; padding:14px; border-radius:8px; overflow-x:auto; font-size:12.5px; }
.spinner-line { color:var(--color-text-muted); font-size:13.5px; padding:60px 30px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
.spinner-ring { width:32px; height:32px; border:3px solid var(--color-border); border-top-color:var(--color-accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner-ring { animation-duration:1.4s; } }

@media (max-width:900px){ .station-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));} }
@media (max-width:600px){
  .page{padding:18px 14px 40px;}
  .topbar{padding:0 14px; height:auto; min-height:72px; row-gap:8px; padding-top:10px; padding-bottom:10px;}
  .topbar-brand{gap:10px;} .sail-logo{height:38px;} .topbar-mark{width:31px;height:31px;font-size:12px;}
  .topbar-title .line1{font-size:11px;} .topbar-title .line2{font-size:15px;}
  .field-row{flex-direction:column;} .spec-cell{border-right:none;}
  .station-grid{grid-template-columns:1fr;}

function escapeHtml(str){ if(str===null||str===undefined) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function formatDate(iso){ if(!iso) return '\u2014'; const d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateDMY(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d.getTime())) return iso; const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear(); }
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return null; const today=new Date(); today.setHours(0,0,0,0); return Math.round((d-today)/86400000); }
function nextId(prefix){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function toast(message, type){
  type = type || 'info';
  let region = document.getElementById('toast-region');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = message;
  region.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    el.addEventListener('animationend', ()=>el.remove(), { once:true });
  }, 3700);
}
function getExtension(name){ return (name||'').split('.').pop().toLowerCase(); }

/* ============================================================
   Google Drive helpers (plain fetch, no client library needed)
   ============================================================ */
async function driveFetchPublic(path, params){
  const url = new URL(DRIVE_FILES_URL + path);
  url.searchParams.set('key', CONFIG.DRIVE_API_KEY);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  if(!res.ok) throw new Error('Drive read failed ('+res.status+')');
  return res;
}

async function driveFetchAuthed(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer '+accessToken });
  const res = await fetch(url, options);
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Drive request failed ('+res.status+'): '+text.slice(0,200));
  }
  return res;
}

async function driveGetJson(fileId){
  const res = await driveFetchPublic('/'+fileId, { alt:'media' });
  return res.json();
}

async function driveSaveJson(fileId, data){
  return driveFetchAuthed(DRIVE_UPLOAD_URL+'/'+fileId+'?uploadType=media', {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
}

async function driveCreateFolder(name){
  const res = await driveFetchAuthed(DRIVE_FILES_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder' })
  });
  return (await res.json()).id;
}

async function driveCreateJsonFile(name, parentId, data){
  const metadata = { name, parents:[parentId], mimeType:'application/json' };
  const boundary = '-------emd'+Date.now();
  const body =
    '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n'+
    '--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n'+
    '--'+boundary+'--';
  const res = await driveFetchAuthed(DRIVE_UPLOAD_URL+'?uploadType=multipart', {
    method:'POST',
    headers:{'Content-Type':'multipart/related; boundary='+boundary},
    body
  });
  return (await res.json()).id;
}

async function driveUploadBinary(file, parentId){
  const metadata = { name:file.name, parents:[parentId] };
  const boundary = '-------emd'+Date.now();
  const arrayBuffer = await file.arrayBuffer();
  const base64Data = arrayBufferToBase64(arrayBuffer);
  const body =
    '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n'+
    '--'+boundary+'\r\nContent-Type: '+file.type+'\r\nContent-Transfer-Encoding: base64\r\n\r\n'+base64Data+'\r\n'+
    '--'+boundary+'--';
  const res = await driveFetchAuthed(DRIVE_UPLOAD_URL+'?uploadType=multipart', {
    method:'POST',
    headers:{'Content-Type':'multipart/related; boundary='+boundary},
    body
  });
  return (await res.json()).id;
}

// Converts an ArrayBuffer to base64 in fixed-size chunks, so encoding large
// files (drawings up to tens of MB) doesn't stall the browser or blow the
// call stack the way a naive single-pass String.fromCharCode(...bytes) can.
function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  const CHUNK_SIZE = 0x8000; // 32KB per chunk
  let binary = '';
  for(let i=0; i<bytes.length; i+=CHUNK_SIZE){
    const chunk = bytes.subarray(i, i+CHUNK_SIZE);
    binary += String.fromCharCode.apply(null, chunk);
  }
  return btoa(binary);
}

async function driveSetPublicReadable(fileId){
  return driveFetchAuthed(DRIVE_FILES_URL+'/'+fileId+'/permissions', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ role:'reader', type:'anyone' })
  });
}

async function driveDeleteFile(fileId){
  if(!fileId) return;
  try { await driveFetchAuthed(DRIVE_FILES_URL+'/'+fileId, { method:'DELETE' }); }
  catch(e){ console.warn('Could not delete Drive file '+fileId, e); }
}

/* ============================================================
   Data load / save (whole-file read-modify-write, same strategy
   the original Node server used with its local db.json)
   ============================================================ */

  DB.stations = DB.stations || [];
  DB.equipment = DB.equipment || [];
  DB.nameplates = DB.nameplates || {};
  DB.vibrationRecords = DB.vibrationRecords || [];
  DB.drawings = DB.drawings || [];
  DB.breakdownHistory = DB.breakdownHistory || [];
  DB.stationDrawings = DB.stationDrawings || [];
  DB.earthPitYears = DB.earthPitYears || [];
  DB.earthPitRecords = DB.earthPitRecords || [];
  DB.safetyDocuments = DB.safetyDocuments || [];
  DB.handGloves = DB.handGloves || [];
  DB.handGloveTests = DB.handGloveTests || [];
  DB.stationSLD = DB.stationSLD || [];
  DB.dismissedAlerts = DB.dismissedAlerts || [];
  DB.homepageBanner = DB.homepageBanner || null;
}

async function saveDb(){

}

/* ============================================================
   Auth
   ============================================================ */
function initAuth(){
  if(!window.google || !google.accounts) { setTimeout(initAuth, 200); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.OAUTH_CLIENT_ID,
    scope: OAUTH_SCOPES,
    callback: async (resp) => {
      if(resp.error){ toast('Sign-in failed: '+resp.error, 'error'); return; }
      accessToken = resp.access_token;
      try {
        const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{Authorization:'Bearer '+accessToken} }).then(r=>r.json());
        currentUserEmail = info.email;
        if(CONFIG.ADMIN_EMAILS.length && !CONFIG.ADMIN_EMAILS.includes(currentUserEmail)){
          toast('This Google account is not on the admin list for this portal.', 'error');
          accessToken = null; currentUserEmail = null;
        } else {
          toast('Signed in as '+currentUserEmail, 'success');
        }
      } catch(e){ console.warn(e); }
      renderTopbar();
      renderRoute();
    }
  });
}

function isAdmin(){ return Boolean(accessToken); }

function login(){
  if(!tokenClient){ toast('Still loading Google sign-in, try again in a second.', 'error'); return; }
  tokenClient.requestAccessToken({ prompt: currentUserEmail ? '' : 'consent' });
}

function logout(){
  if(accessToken){ google.accounts.oauth2.revoke(accessToken, ()=>{}); }
  accessToken = null; currentUserEmail = null;
  toast('Logged out.', 'success');
  renderTopbar();
  renderRoute();
}

/* ============================================================
   Generic modal helpers
   ============================================================ */
function openModal(title, bodyHtml, footerHtml){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml;
  document.getElementById('modal-overlay').style.display = 'flex';
  document.querySelector('#modal-overlay .modal').style.maxWidth = '480px';
}
function closeModal(){ document.getElementById('modal-overlay').style.display = 'none'; }

function openPreviewModal(opts){
  const body = document.getElementById('preview-body');
  document.getElementById('preview-title').textContent = opts.title || 'Preview';
  if(opts.kind === 'image'){
    body.innerHTML = '<img src="'+opts.url+'" alt="'+escapeHtml(opts.title||'')+'" class="preview-image">';
  } else if(opts.kind === 'drive-image'){
    body.innerHTML = '<img src="'+opts.url+'" alt="'+escapeHtml(opts.title||'')+'" class="preview-image">';
  } else if(opts.kind === 'drive-pdf'){
    body.innerHTML = '<iframe src="'+opts.previewUrl+'" class="preview-frame" title="'+escapeHtml(opts.title||'')+'"></iframe>';
  } else {
    body.innerHTML = '<div class="preview-unsupported"><p>Preview isn\'t available for this file type.</p>'
      + '<a class="btn btn-primary btn-sm" href="'+opts.downloadUrl+'" target="_blank" rel="noopener">Download instead</a></div>';
  }
  document.getElementById('preview-overlay').style.display = 'flex';
}
function closePreviewModal(){
  document.getElementById('preview-overlay').style.display = 'none';
  document.getElementById('preview-body').innerHTML = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });
document.getElementById('preview-close').addEventListener('click', closePreviewModal);
document.getElementById('preview-overlay').addEventListener('click', (e)=>{ if(e.target.id==='preview-overlay') closePreviewModal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(document.getElementById('preview-overlay').style.display === 'flex') closePreviewModal();
  else if(document.getElementById('modal-overlay').style.display === 'flex') closeModal();
});

/* ============================================================
   Router
   ============================================================ */
window.addEventListener('hashchange', renderRoute);

function renderRoute(){
  if(!CONFIG.DB_FILE_ID){ renderSetupScreen(); return; }
  const hash = location.hash || '#/';
  const stationMatch = hash.match(/^#\/station\/(.+)$/);
  const equipmentMatch = hash.match(/^#\/equipment\/(.+)$/);
  const gloveMatch = hash.match(/^#\/ppe\/gloves\/(.+)$/);
  if(stationMatch) renderStationPage(decodeURIComponent(stationMatch[1]));
  else if(equipmentMatch) renderEquipmentPage(decodeURIComponent(equipmentMatch[1]));
  else if(hash === '#/safety') renderSafetyPage();
  else if(hash === '#/ppe') renderPpePage();
  else if(hash === '#/ppe/gloves') renderGloveListPage();
  else if(gloveMatch) renderGloveDetailPage(decodeURIComponent(gloveMatch[1]));
  else renderHomePage();
  const app = document.getElementById('app');
  app.classList.remove('page-enter');
  void app.offsetWidth; // force reflow so the animation restarts on every navigation
  app.classList.add('page-enter');
  window.scrollTo(0, 0);
}

function stationTag(name){
  const words = name.split(' ').filter(w=>/[A-Za-z0-9]/.test(w));
  return (words.slice(0,3).map(w=>w[0]).join('').toUpperCase()) || 'STN';
}

function computeActiveAlerts(){
  const alerts = [];
  DB.handGloves.forEach(g=>{
    const tests = DB.handGloveTests.filter(t=>t.gloveId===g.id).sort((a,b)=>(b.testingDate||'').localeCompare(a.testingDate||''));
    const latest = tests[0];
    if(!latest || !latest.dueDate) return;
    const d = daysUntil(latest.dueDate);
    if(d === null || d > HAND_GLOVE_ALERT_DAYS) return;
    const key = 'glove:'+g.id+':'+latest.dueDate;
    if(DB.dismissedAlerts.includes(key)) return;
    const station = DB.stations.find(s=>s.id===g.stationId);
    alerts.push({
      key, dueDate: latest.dueDate,
      title: 'Rubber Hand Gloves Testing Due',
      message: 'Testing due for Hand Gloves No. '+escapeHtml(g.gloveNumber||'')+' at '+escapeHtml(station?station.name:'Unknown station')+' on '+formatDateDMY(latest.dueDate)+'.'
    });
  });
  DB.earthPitRecords.forEach(r=>{
    if(!r.dueDate) return;
    const d = daysUntil(r.dueDate);
    if(d === null || d > EARTH_PIT_ALERT_DAYS) return;
    const key = 'earthpit:'+r.id+':'+r.dueDate;
    if(DB.dismissedAlerts.includes(key)) return;
    const station = DB.stations.find(s=>s.id===r.stationId);
    alerts.push({
      key, dueDate: r.dueDate,
      title: 'Earth Pit Testing Due',
      message: 'Earth Pit '+escapeHtml(r.pitNo||'(unnamed)')+' at '+escapeHtml(station?station.name:'Unknown station')+' is due for testing on '+formatDateDMY(r.dueDate)+'.'
    });
  });
  alerts.sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  return alerts;
}

function renderAlertsHtml(){
  const alerts = computeActiveAlerts();
  if(alerts.length === 0) return '';
  const admin = isAdmin();
  const items = alerts.map(a=>
    '<div class="alert-item">'
    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L2 20h20L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>'
    + '<div class="alert-item-body"><div class="alert-item-title">'+a.title+'</div><div class="alert-item-message">'+a.message+'</div></div>'
    + (admin ? '<button class="alert-dismiss" data-dismiss-alert="'+encodeURIComponent(a.key)+'" title="Dismiss alert">&times;</button>' : '')
    + '</div>'
  ).join('');
  return '<div class="alert-stack" id="alert-stack">'+items+'</div>';
}

function wireAlertDismissButtons(){
  document.querySelectorAll('[data-dismiss-alert]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = decodeURIComponent(btn.dataset.dismissAlert);
      try {
        DB.dismissedAlerts.push(key);
        await saveDb();
        renderHomePage();
      } catch(e){ toast(e.message, 'error'); }
    });
  });
}

function openBannerUploadModal(){
  const existing = DB.homepageBanner;
  openModal(
    existing ? 'Replace Homepage Banner' : 'Add Homepage Banner',
    '<div id="modal-form-error"></div>'
    + '<div class="field"><label>Image (JPG, JPEG, PNG)</label><input type="file" id="banner-file-input" accept=".jpg,.jpeg,.png"></div>'
    + '<div class="helper-text">Shown at the very top of the homepage, above the safety banner. If no image is set, this space stays hidden entirely.</div>',
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">'+(existing?'Replace':'Upload')+'</button>'
  );
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const fileInput = document.getElementById('banner-file-input');
    const errBox = document.getElementById('modal-form-error');
    if(!fileInput.files.length){ errBox.innerHTML = '<div class="form-error">Please choose an image.</div>'; return; }
    const file = fileInput.files[0];
    const ext = getExtension(file.name);
    if(!BANNER_EXTENSIONS.includes(ext)){ errBox.innerHTML = '<div class="form-error">File must be JPG, JPEG, or PNG.</div>'; return; }
    const saveBtn = document.getElementById('modal-save-btn');
    saveBtn.disabled = true; saveBtn.textContent = 'Uploading\u2026';
    try {
      const fileId = await driveUploadBinary(file, CONFIG.UPLOADS_FOLDER_ID);
      await driveSetPublicReadable(fileId);
      const oldFileId = existing ? existing.fileId : null;
      DB.homepageBanner = { id: nextId('banner'), fileId, originalName: file.name, sizeBytes: file.size, uploadedAt: new Date().toISOString(), uploadedBy: currentUserEmail||'admin' };
      await saveDb();
      if(oldFileId) driveDeleteFile(oldFileId);
      closeModal();
      toast(existing ? 'Banner replaced.' : 'Banner added.', 'success');
      renderHomePage();
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; saveBtn.disabled=false; saveBtn.textContent=existing?'Replace':'Upload'; }
  });
}

async function deleteBanner(){
  if(!confirm('Remove the homepage banner image?')) return;
  const existing = DB.homepageBanner;
  try {
    DB.homepageBanner = null;
    await saveDb();
    if(existing && existing.fileId) driveDeleteFile(existing.fileId);
    toast('Banner removed.', 'success');
    renderHomePage();
  } catch(e){ toast(e.message, 'error'); }
}

function openStationModal(id){
  const station = id ? DB.stations.find(s=>s.id===id) : null;
  openModal(
    station ? 'Rename Station' : 'Add Station',
    '<div id="modal-form-error"></div><div class="field"><label>Station name</label><input type="text" id="station-name-input" value="'+escapeHtml(station?station.name:'')+'"></div>',
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Save</button>'
  );
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const name = document.getElementById('station-name-input').value.trim();
    const errBox = document.getElementById('modal-form-error');
    if(!name){ errBox.innerHTML = '<div class="form-error">Station name is required.</div>'; return; }
    try {
      if(station){ station.name = name; }
      else {
        const maxOrder = DB.stations.reduce((m,s)=>Math.max(m,s.sortOrder),-1);
        DB.stations.push({ id: nextId('stn'), name, sortOrder: maxOrder+1, createdAt: new Date().toISOString() });
      }
      await saveDb();
      closeModal();
      toast(station?'Station renamed.':'Station added.', 'success');
      renderHomePage();
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; }
  });
}

async function deleteStation(id){
  const station = DB.stations.find(s=>s.id===id);
  const count = DB.equipment.filter(e=>e.stationId===id).length;
  if(count > 0){ toast('This station still has '+count+' equipment item(s). Remove them first.', 'error'); return; }
  if(!confirm('Delete "'+station.name+'"?')) return;
  try {
    const stationDrawingsToRemove = DB.stationDrawings.filter(d=>d.stationId===id);
    const yearIdsToRemove = DB.earthPitYears.filter(y=>y.stationId===id).map(y=>y.id);
    const sldToRemove = DB.stationSLD.find(s=>s.stationId===id);
    DB.stations = DB.stations.filter(s=>s.id!==id);
    DB.stationDrawings = DB.stationDrawings.filter(d=>d.stationId!==id);
    DB.earthPitYears = DB.earthPitYears.filter(y=>y.stationId!==id);
    DB.earthPitRecords = DB.earthPitRecords.filter(r=>!yearIdsToRemove.includes(r.yearId));
    DB.stationSLD = DB.stationSLD.filter(s=>s.stationId!==id);
    await saveDb();
    stationDrawingsToRemove.forEach(d=>{ if(d.fileId) driveDeleteFile(d.fileId); });
    if(sldToRemove && sldToRemove.fileId) driveDeleteFile(sldToRemove.fileId);
    toast('Station deleted.', 'success');
    renderHomePage();
  } catch(e){ toast(e.message, 'error'); }
}

function openEquipmentModal(stationId, equipmentId){
  const item = equipmentId ? DB.equipment.find(e=>e.id===equipmentId) : null;
  const currentCategory = item ? (item.category || 'Other') : 'Other';
  const currentRunningMode = item ? (item.runningMode || 'DOL Scheme') : 'DOL Scheme';

  const runningModeOptions = RUNNING_MODES.map(m=>'<option value="'+m+'" '+(currentRunningMode===m?'selected':'')+'>'+m+'</option>').join('');

    item ? 'Rename Equipment' : 'Add Equipment',

    + '<div class="field"><label>Equipment name</label><input type="text" id="equipment-name-input" value="'+escapeHtml(item?item.name:'')+'" placeholder="e.g. P-1 Booster Motor"></div>'
    + '<div class="field"><label>Running Mode</label><select id="equipment-runningmode-input">'+runningModeOptions+'</select>'
    + '<div class="helper-text">Equipment running on a VFD Scheme shows a badge in the equipment list. Change this any time the starter configuration is converted.</div></div>'
    + '<div class="field"><label>Equipment Category</label><select id="equipment-category-input">'+categoryOptions+'</select>'
    + '<div class="helper-text">Choose "Motor" to enable the Shop Reference No. and Bearing DE/NDE fields in Nameplate Specs.</div></div>',
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Save</button>'

    const name = document.getElementById('equipment-name-input').value.trim();
    const category = document.getElementById('equipment-category-input').value;
    const runningMode = document.getElementById('equipment-runningmode-input').value;
    const errBox = document.getElementById('modal-form-error');
    if(!name){ errBox.innerHTML = '<div class="form-error">Equipment name is required.</div>'; return; }
    try {
      if(item){ item.name = name; item.category = category; item.runningMode = runningMode; }
      else {
        const siblings = DB.equipment.filter(e=>e.stationId===stationId);
        const maxOrder = siblings.reduce((m,e)=>Math.max(m,e.sortOrder),-1);
        const newItem = { id: nextId('eqp'), stationId, name, category, runningMode, sortOrder: maxOrder+1, createdAt: new Date().toISOString() };

  });
}

/* ---- Copy Equipment: reuse Nameplate Specs from any existing equipment to speed up data entry.
   Only Nameplate Specs (incl. Equipment Type, Bearing DE/NDE, etc.) and the equipment's category
   are copied. Vibration records, drawings, station drawings, breakdown history, images, and any
   other operational/maintenance data are never copied — the new equipment starts fresh, exactly
   like any other newly created equipment. ---- */
function openCopyEquipmentModal(targetStationId){
  const allEquipment = DB.equipment.slice().sort((a,b)=>a.name.localeCompare(b.name));
  openModal(
    'Copy Equipment — Select Source',
    '<div id="modal-form-error"></div>'
    + '<div class="helper-text" style="margin-bottom:10px;">Pick any existing equipment (from any station) to copy its Nameplate Specs from. Vibration records, drawings, and breakdown history are never copied.</div>'
    + '<div class="field"><label>Search equipment by name</label><input type="text" id="copy-eq-search" placeholder="Type to filter..."></div>'
    + '<div id="copy-eq-list" style="max-height:320px; overflow-y:auto; margin-top:10px;"></div>',
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button>'
  );
  document.querySelector('#modal-overlay .modal').style.maxWidth = '560px';
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);

  function renderList(filterText){
    const listEl = document.getElementById('copy-eq-list');
    if(!listEl) return;
    const filtered = allEquipment.filter(e=>e.name.toLowerCase().includes(filterText.trim().toLowerCase()));
    if(filtered.length===0){
      listEl.innerHTML = '<div class="helper-text" style="padding:10px 0;">No matching equipment found.</div>';
      return;
    }
    listEl.innerHTML = filtered.map(e=>{
      const station = DB.stations.find(s=>s.id===e.stationId);
      return '<div style="display:flex; justify-content:space-between; align-items:center; padding:9px 10px; border:1px solid var(--color-border); border-radius:var(--radius); margin-bottom:6px;">'
        + '<div><div style="font-weight:600; font-size:13.5px;">'+escapeHtml(e.name)+'</div>'
        + '<div class="helper-text">'+escapeHtml(station?station.name:'Unknown station')+(e.category==='Motor'?' &middot; Motor':'')+'</div></div>'
        + '<button class="btn btn-outline btn-sm" data-copy-select="'+e.id+'">Select</button></div>';
    }).join('');
    listEl.querySelectorAll('[data-copy-select]').forEach(btn=>{
      btn.addEventListener('click', ()=>openCopyEquipmentConfirmModal(targetStationId, btn.dataset.copySelect));
    });
  }

  document.getElementById('copy-eq-search').addEventListener('input', (e)=>renderList(e.target.value));
  renderList('');
}

function openCopyEquipmentConfirmModal(targetStationId, sourceId){
  const source = DB.equipment.find(e=>e.id===sourceId);
  if(!source){ toast('Source equipment not found.', 'error'); return; }
  const sourceNameplate = DB.nameplates[sourceId] || {};

  openModal(
    'Copy Equipment — Confirm Details',
    '<div id="modal-form-error"></div>'
    + '<div class="helper-text" style="margin-bottom:10px;">Copying Nameplate Specs from <strong>'+escapeHtml(source.name)+'</strong>. Vibration records, drawings, station drawings, breakdown history, and images are never copied — this new equipment starts with a clean history.</div>'
    + '<div class="field"><label>Equipment Name (for the new equipment)</label><input type="text" id="copy-new-name" value="'+escapeHtml(source.name)+'"></div>'
    + '<div class="field"><label>Equipment ID / Serial No.</label><input type="text" id="copy-new-serial" placeholder="Enter a new, unique ID (leave blank if not known yet)"></div>'
    + '<div class="field"><label>Shop Reference No.</label><input type="text" id="copy-new-shopref" placeholder="Enter a new, unique reference (leave blank if not known yet)"></div>'
    + '<div class="helper-text">These three fields are left blank on purpose since they must be unique to the new equipment. Every other Nameplate Spec (Make, Rating, Voltage, Bearing DE/NDE, etc.) is copied as-is and can still be adjusted afterward.</div>',
    '<button class="btn btn-outline" id="modal-back-btn">&larr; Back</button><button class="btn btn-primary" id="modal-save-btn">Create Copy</button>'
  );
  document.querySelector('#modal-overlay .modal').style.maxWidth = '520px';
  document.getElementById('modal-back-btn').addEventListener('click', ()=>openCopyEquipmentModal(targetStationId));
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const name = document.getElementById('copy-new-name').value.trim();
    const errBox = document.getElementById('modal-form-error');
    if(!name){ errBox.innerHTML = '<div class="form-error">Equipment name is required.</div>'; return; }
    try {
      const siblings = DB.equipment.filter(e=>e.stationId===targetStationId);
      const maxOrder = siblings.reduce((m,e)=>Math.max(m,e.sortOrder),-1);
      const newItem = { id: nextId('eqp'), stationId: targetStationId, name, category: source.category || 'Other', runningMode: source.runningMode || 'DOL Scheme', sortOrder: maxOrder+1, createdAt: new Date().toISOString() };
      DB.equipment.push(newItem);
      // Shallow-copy every Nameplate Spec field from the source (Make, Rating, Equipment Type,
      // Bearing DE/NDE, etc.), then overwrite just the unique-identifier fields with fresh values.
      const newNameplate = Object.assign({}, sourceNameplate);
      newNameplate.serialNo = document.getElementById('copy-new-serial').value.trim();
      newNameplate.shopReferenceNo = document.getElementById('copy-new-shopref').value.trim();
      DB.nameplates[newItem.id] = newNameplate;
      await saveDb();
      closeModal();
      toast('Equipment copied. Vibration records, drawings, and breakdown history were not copied.', 'success');
      renderStationEquipmentTab(targetStationId);
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; }
  });
}

async function deleteEquipment(id, stationId){
  const item = DB.equipment.find(e=>e.id===id);
  if(!confirm('Delete "'+item.name+'"? This will also delete its nameplate data, vibration records, drawings, and breakdown history.')) return;
  try {
    delete DB.nameplates[id];
    DB.vibrationRecords = DB.vibrationRecords.filter(v=>v.equipmentId!==id);
    const breakdownsToRemove = DB.breakdownHistory.filter(b=>b.equipmentId===id);
    const drawingsToRemove = DB.drawings.filter(d=>d.equipmentId===id);
    DB.breakdownHistory = DB.breakdownHistory.filter(b=>b.equipmentId!==id);
    DB.drawings = DB.drawings.filter(d=>d.equipmentId!==id);
    DB.equipment = DB.equipment.filter(e=>e.id!==id);
    await saveDb();
    // Best-effort cleanup of the underlying Drive files (not blocking on failures).
    breakdownsToRemove.forEach(b=>{ if(b.imageFileId) driveDeleteFile(b.imageFileId); });
    drawingsToRemove.forEach(d=>{ if(d.fileId) driveDeleteFile(d.fileId); });
    toast('Equipment deleted.', 'success');
    renderStationPage(stationId);
  } catch(e){ toast(e.message, 'error'); }
}

/* ---- Nameplate ---- */
function renderNameplate(equipmentId, editMode){
  const panel = document.getElementById('panel-nameplate');
  const np = DB.nameplates[equipmentId] || {};
  const admin = isAdmin();
  const equipmentItem = DB.equipment.find(e=>e.id===equipmentId);
  const isMotor = Boolean(equipmentItem && equipmentItem.category === 'Motor');
  const fieldDefs = isMotor ? NAMEPLATE_FIELD_DEFS.concat(MOTOR_ONLY_FIELD_DEFS) : NAMEPLATE_FIELD_DEFS;

  const cells = fieldDefs.map(f=>{
    const value = np[f.key] || '';
    return editMode
      ? '<div class="spec-cell"><div class="spec-label">'+f.label+'</div><input type="text" data-field="'+f.key+'" value="'+escapeHtml(value)+'"></div>'
      : '<div class="spec-cell"><div class="spec-label">'+f.label+'</div><div class="spec-value '+(value?'':'empty')+'">'+(value?escapeHtml(value):'Not recorded')+'</div></div>';
  }).join('');

  const notesCell = editMode
    ? '<div class="spec-cell notes-cell"><div class="spec-label">Notes</div><textarea data-field="notes">'+escapeHtml(np.notes||'')+'</textarea></div>'
    : '<div class="spec-cell notes-cell"><div class="spec-label">Notes</div><div class="spec-value '+(np.notes?'':'empty')+'" style="font-family:var(--font-body); font-weight:400;">'+(np.notes?escapeHtml(np.notes):'No notes recorded')+'</div></div>';

  panel.innerHTML =
    '<div class="spec-sheet"><div class="spec-sheet-header"><span>Motor / Equipment Nameplate</span>'
    + (admin ? (editMode
        ? '<div style="display:flex; gap:8px;"><button class="btn btn-outline btn-sm" id="np-cancel">Cancel</button><button class="btn btn-primary btn-sm" id="np-save">Save specs</button></div>'
        : '<button class="btn btn-ghost-light btn-sm" id="np-edit">Edit specs</button>') : '')
    + '</div><div class="spec-grid">'+cells+notesCell+'</div></div>';

  if(admin){
    if(editMode){
      document.getElementById('np-cancel').addEventListener('click', ()=>renderNameplate(equipmentId, false));
      document.getElementById('np-save').addEventListener('click', async ()=>{
        const payload = {};
        panel.querySelectorAll('[data-field]').forEach(el=>{ payload[el.dataset.field] = el.value; });
        try {
          DB.nameplates[equipmentId] = payload;
          await saveDb();
          toast('Nameplate specs saved.', 'success');
          renderNameplate(equipmentId, false);
        } catch(e){ toast(e.message, 'error'); }
      });
    } else {
      document.getElementById('np-edit').addEventListener('click', ()=>renderNameplate(equipmentId, true));
    }
  }
}

/* ---- Vibration records ---- */

  const panel = document.getElementById('panel-vibration');
  const admin = isAdmin();
  const records = DB.vibrationRecords.filter(r=>r.equipmentId===equipmentId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const cards = records.map(r=>{
    const readings = r.readings || {};
    const bodyRows = VIB_BEARINGS.map(b=>{
      const row = readings[b] || {};
      return '<tr><td class="mono" style="font-weight:600;">'+b+'</td>'

        + '</tr>';
    }).join('');
    return '<div class="spec-sheet" style="margin-bottom:16px;">'
      + '<div class="spec-sheet-header">'

      + (admin ? '<div style="display:flex; gap:8px;"><button class="btn btn-ghost-light btn-sm" data-vib-edit="'+r.id+'">Edit</button><button class="btn btn-ghost-light btn-sm" data-vib-delete="'+r.id+'">Delete</button></div>' : '')

      const rec = records.find(r=>r.id===btn.dataset.vibEdit);
      openVibrationModal(equipmentId, rec);

    panel.querySelectorAll('[data-vib-delete]').forEach(btn=>btn.addEventListener('click', ()=>deleteVibration(btn.dataset.vibDelete, equipmentId)));

function openVibrationModal(equipmentId, record){
  const readings = (record && record.readings) || {};
  const modeOptions = VIB_MODES.map(m=>'<option value="'+m+'" '+(record&&record.modeOfOperation===m?'selected':'')+'>'+m+'</option>').join('');
  const bearingRows = VIB_BEARINGS.map(b=>{
    const row = readings[b] || {};
    const cells = VIB_AXES.map(axis=>'<td><input type="number" step="any" id="rf-'+b+'-'+axis+'" value="'+escapeHtml(row[axis]||'')+'" style="width:100%;"></td>').join('');
    return '<tr><td class="mono" style="font-weight:600;">'+b+'</td>'+cells+'</tr>';
  }).join('');

  openModal(
    record ? 'Edit Vibration Reading' : 'Add Vibration Reading',
    '<div id="modal-form-error"></div>'
    + '<div class="field-row"><div class="field"><label>Date</label><input type="date" id="rf-date" value="'+(record?record.date:'')+'"></div>'
    + '<div class="field"><label>Mode of Operation</label><select id="rf-mode"><option value="" disabled '+(!record?'selected':'')+'>Select mode&hellip;</option>'+modeOptions+'</select></div></div>'
    + '<div class="field"><label>Vibration readings (mm/s)</label><table class="data-table"><thead><tr><th>Bearing</th><th>H (mm/s)</th><th>V (mm/s)</th><th>A (mm/s)</th></tr></thead><tbody>'+bearingRows+'</tbody></table></div>',
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Save</button>'
  );
  document.querySelector('#modal-overlay .modal').style.maxWidth = '620px';
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const date = document.getElementById('rf-date').value;
    const modeOfOperation = document.getElementById('rf-mode').value;
    const errBox = document.getElementById('modal-form-error');
    if(!date){ errBox.innerHTML = '<div class="form-error">Date is required.</div>'; return; }
    if(!modeOfOperation){ errBox.innerHTML = '<div class="form-error">Mode of Operation is required.</div>'; return; }
    const newReadings = {};
    VIB_BEARINGS.forEach(b=>{ newReadings[b] = {}; VIB_AXES.forEach(axis=>{ newReadings[b][axis] = document.getElementById('rf-'+b+'-'+axis).value; }); });
    try {
      if(record){ record.date=date; record.modeOfOperation=modeOfOperation; record.readings=newReadings; }
      else {
        DB.vibrationRecords.push({ id: nextId('vib'), equipmentId, date, modeOfOperation, readings: newReadings, recordedBy: currentUserEmail||'admin', createdAt: new Date().toISOString() });
      }
      await saveDb();
      closeModal();
      toast('Vibration record saved.', 'success');
      renderVibration(equipmentId);
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; }
  });
}

async function deleteVibration(id, equipmentId){
  if(!confirm('Delete this vibration record?')) return;
  try {
    DB.vibrationRecords = DB.vibrationRecords.filter(v=>v.id!==id);
    await saveDb();
    toast('Record deleted.', 'success');
    renderVibration(equipmentId);
  } catch(e){ toast(e.message, 'error'); }
}

/* ---- Earth Pits: year-wise resistance testing register, kept fully separate per station. ---- */
let earthPitSelectedYearId = null; // drives which sub-view (year list vs. register) is shown; reset per station page load

function suggestNextYearLabel(currentLabel){
  const m = currentLabel && currentLabel.match(/(\d{4})\D+(\d{2,4})/);
  if(!m) return '';
  const startY = parseInt(m[1],10) + 1;
  const endDigits = String((startY+1) % 100).padStart(2,'0');
  return startY + '\u2013' + endDigits;
}

function renderEarthPitsTab(stationId){
  if(earthPitSelectedYearId){
    const stillValid = DB.earthPitYears.some(y=>y.id===earthPitSelectedYearId && y.stationId===stationId);
    if(!stillValid) earthPitSelectedYearId = null;
  }
  if(earthPitSelectedYearId) renderEarthPitRegister(stationId, earthPitSelectedYearId);
  else renderEarthPitYearList(stationId);
}

function renderEarthPitYearList(stationId){
  const panel = document.getElementById('panel-station-earthpits');
  if(!panel) return;
  const admin = isAdmin();
  let years = DB.earthPitYears.filter(y=>y.stationId===stationId).sort((a,b)=>a.sortOrder-b.sortOrder);

  if(years.length === 0){
    if(admin){
      // Station predates the Earth Pits feature (or was just created) - seed the default year for real, once.
      const seeded = { id: nextId('epy'), stationId, label: SEED_EARTH_PIT_YEAR, sortOrder: 0, createdAt: new Date().toISOString() };
      DB.earthPitYears.push(seeded);
      saveDb().catch(err=>toast('Could not save default financial year: '+err.message, 'error'));
      years = [seeded];
    } else {
      // Visitor viewing a station before any admin has opened Earth Pits here yet: show the
      // expected default year read-only. It becomes a real, persisted year the moment an admin visits.
      years = [{ id:'', stationId, label: SEED_EARTH_PIT_YEAR, sortOrder:0, createdAt:'' }];
    }
  }

  const cards = years.map(y=>{
    const count = y.id ? DB.earthPitRecords.filter(r=>r.yearId===y.id).length : 0;
    return '<div class="station-card" '+(y.id?('data-year-link="'+y.id+'"'):'')+'>'
      + '<div class="station-tag">FINANCIAL YEAR</div>'
      + '<h3>'+escapeHtml(y.label)+'</h3>'
      + '<div class="station-meta"><span>'+count+' earth pit record'+(count===1?'':'s')+'</span></div>'
      + '<div class="station-card-footer">'
      + (y.id
          ? '<button class="btn btn-station-open btn-sm" data-year-open="'+y.id+'">Open register &rarr;</button>'
            + (admin ? '<button class="btn btn-danger btn-sm" data-year-delete="'+y.id+'">Delete register</button>' : '')
          : '<span class="helper-text">Opens once an admin visits this station</span>')
      + '</div></div>';
  }).join('');

  panel.innerHTML =
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">'
    + '<div class="page-subtitle" style="margin:0;">Earth pit resistance testing records, maintained year-wise and kept fully separate for this station.</div>'
    + (admin ? '<button class="btn btn-primary btn-sm" id="add-year-btn">+ Add Year</button>' : '')
    + '</div>'
    + '<div class="station-grid" style="margin-top:6px;">' + cards + '</div>';

  panel.querySelectorAll('[data-year-link]').forEach(card=>{
    card.style.cursor = 'pointer';
    card.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      earthPitSelectedYearId = card.dataset.yearLink;
      renderEarthPitsTab(stationId);
    });
  });
  panel.querySelectorAll('[data-year-open]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ earthPitSelectedYearId = btn.dataset.yearOpen; renderEarthPitsTab(stationId); });
  });
  panel.querySelectorAll('[data-year-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteEarthPitYear(stationId, btn.dataset.yearDelete));
  });
  const addYearBtn = document.getElementById('add-year-btn');
  if(addYearBtn) addYearBtn.addEventListener('click', ()=>openAddYearModal(stationId));
}

async function deleteEarthPitYear(stationId, yearId){
  const year = DB.earthPitYears.find(y=>y.id===yearId);
  const count = DB.earthPitRecords.filter(r=>r.yearId===yearId).length;
  if(!confirm('Delete the "'+(year?year.label:'')+'" register'+(count?' and all '+count+' of its earth pit record(s)':'')+'? This cannot be undone.')) return;
  try {
    DB.earthPitYears = DB.earthPitYears.filter(y=>y.id!==yearId);
    DB.earthPitRecords = DB.earthPitRecords.filter(r=>r.yearId!==yearId);
    await saveDb();
    toast('Register deleted.', 'success');
    renderEarthPitYearList(stationId);
  } catch(e){ toast(e.message, 'error'); }
}

function openAddYearModal(stationId){
  const years = DB.earthPitYears.filter(y=>y.stationId===stationId).sort((a,b)=>a.sortOrder-b.sortOrder);
  const lastYear = years.length ? years[years.length-1] : null;
  const suggested = suggestNextYearLabel(lastYear ? lastYear.label : SEED_EARTH_PIT_YEAR);
  const priorPitCount = lastYear ? DB.earthPitRecords.filter(r=>r.yearId===lastYear.id).length : 0;

  openModal(
    'Add Financial Year',
    '<div id="modal-form-error"></div>'
    + '<div class="field"><label>Financial year label</label><input type="text" id="new-year-label" value="'+escapeHtml(suggested)+'" placeholder="e.g. 2027\u201328"></div>'
    + '<div class="helper-text">Each financial year keeps its own, completely independent set of earth pit records.</div>'
    + (priorPitCount > 0
        ? '<div class="field" style="margin-top:6px;"><label style="font-weight:400; display:flex; align-items:flex-start; gap:8px;">'
          + '<input type="checkbox" id="copy-pits-checkbox" checked style="margin-top:3px;">'
          + '<span>Copy the '+priorPitCount+' earth pit number'+(priorPitCount===1?'':'s')+' from <strong>'+escapeHtml(lastYear.label)+'</strong> into this new year (S. No. and Earth Pit No. only &mdash; resistance value, dates, and status fields all start blank/default so you just fill in fresh readings).</span>'
          + '</label></div>'
        : ''),
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Add Year</button>'
  );
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const label = document.getElementById('new-year-label').value.trim();
    const errBox = document.getElementById('modal-form-error');
    if(!label){ errBox.innerHTML = '<div class="form-error">Please enter a year label.</div>'; return; }
    const isDuplicateYear = years.some(y => y.label.trim().toLowerCase() === label.toLowerCase());
    if(isDuplicateYear){ errBox.innerHTML = '<div class="form-error">A register for "'+escapeHtml(label)+'" already exists for this station.</div>'; return; }
    const copyCheckbox = document.getElementById('copy-pits-checkbox');
    const shouldCopy = copyCheckbox && copyCheckbox.checked;
    try {
      const maxOrder = years.reduce((m,y)=>Math.max(m,y.sortOrder),-1);
      const newYear = { id: nextId('epy'), stationId, label, sortOrder: maxOrder+1, createdAt: new Date().toISOString() };
      DB.earthPitYears.push(newYear);
      if(shouldCopy && lastYear){
        const priorRecords = DB.earthPitRecords.filter(r=>r.yearId===lastYear.id);
        priorRecords.forEach(r=>{
          DB.earthPitRecords.push({
            id: nextId('epr'), stationId, yearId: newYear.id,
            sNo: r.sNo || '', pitNo: r.pitNo || '',
            resistanceValue: '', testingDate: '', dueDate: '',
            condition: 'OK', coveringPlates: 'OK', displayBoard: 'OK', continuity: 'OK',
            createdAt: new Date().toISOString()
          });
        });
      }
      await saveDb();
      closeModal();
      toast(shouldCopy && lastYear ? 'Financial year added with earth pit numbers copied.' : 'Financial year added.', 'success');
      earthPitSelectedYearId = newYear.id;
      renderEarthPitsTab(stationId);
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; }
  });
}

function renderEarthPitRegister(stationId, yearId){
  const panel = document.getElementById('panel-station-earthpits');
  if(!panel) return;
  const year = DB.earthPitYears.find(y=>y.id===yearId);
  if(!year){ earthPitSelectedYearId = null; renderEarthPitYearList(stationId); return; }
  const admin = isAdmin();
  const records = DB.earthPitRecords.filter(r=>r.yearId===yearId).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));

  const statusHeaderCells = EARTHPIT_STATUS_FIELDS.map(f=>'<th>'+f.label+'</th>').join('');

  const rows = records.map(r=>{
    const statusReadCells = EARTHPIT_STATUS_FIELDS.map(f=>'<td>'+escapeHtml(r[f.key]||'OK')+'</td>').join('');
    return '<tr>'
      + '<td class="mono">'+escapeHtml(r.sNo||'\u2014')+'</td>'
      + '<td>'+escapeHtml(r.pitNo||'\u2014')+'</td>'
      + '<td class="mono">'+escapeHtml(r.resistanceValue||'\u2014')+'</td>'
      + '<td class="mono">'+formatDate(r.testingDate)+'</td>'
      + '<td class="mono">'+formatDate(r.dueDate)+'</td>'
      + statusReadCells
      + (admin ? '<td class="row-actions"><button class="btn btn-outline btn-sm" data-ep-edit="'+r.id+'">Edit</button><button class="btn btn-danger btn-sm" data-ep-delete="'+r.id+'">Delete</button></td>' : '')
      + '</tr>';
  }).join('');

  panel.innerHTML =
    '<div class="breadcrumb" style="margin-bottom:14px;"><a href="#" id="back-to-years">&larr; All financial years</a><span class="sep">/</span><span class="current">'+escapeHtml(year.label)+'</span></div>'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">'
    + '<div class="page-subtitle" style="margin:0;">Earth pit register for <strong style="color:var(--color-text);">'+escapeHtml(year.label)+'</strong>.</div>'
    + (admin ? '<button class="btn btn-primary btn-sm" id="add-earthpit-btn">+ Add Earth Pit</button>' : '')
    + '</div>'
    + (records.length===0
      ? '<div class="empty-state"><h3>No earth pit records yet</h3><p>'+(admin?'Add the first record above.':'No records have been added for this year yet.')+'</p></div>'
      : '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>'
        + '<th>S. No.</th><th>Earth Pit No.</th><th>Earth Resistance Value (&Omega;)</th><th>Testing Date</th><th>Due Date</th>'+statusHeaderCells
        + (admin?'<th></th>':'')
        + '</tr></thead><tbody>'+rows+'</tbody></table></div>');

  document.getElementById('back-to-years').addEventListener('click', (e)=>{
    e.preventDefault();
    earthPitSelectedYearId = null;
    renderEarthPitsTab(stationId);
  });

  if(!admin) return;

  document.getElementById('add-earthpit-btn').addEventListener('click', ()=>openEarthPitModal(stationId, yearId));
  panel.querySelectorAll('[data-ep-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = records.find(r=>r.id===btn.dataset.epEdit);
      openEarthPitModal(stationId, yearId, rec);
    });
  });
  panel.querySelectorAll('[data-ep-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this earth pit record?')) return;
      try {
        DB.earthPitRecords = DB.earthPitRecords.filter(r=>r.id!==btn.dataset.epDelete);
        await saveDb();
        toast('Record deleted.', 'success');
        renderEarthPitRegister(stationId, yearId);
      } catch(e){ toast(e.message, 'error'); }
    });
  });
}

function openEarthPitModal(stationId, yearId, record){
  const statusFieldsHtml = EARTHPIT_STATUS_FIELDS.map(f=>
    '<div class="field"><label>'+f.label+'</label><select id="ep-'+f.key+'-input">'
    + EARTHPIT_STATUS_OPTIONS.map(o=>'<option value="'+o+'" '+((record&&record[f.key]||'OK')===o?'selected':'')+'>'+o+'</option>').join('')
    + '</select></div>'
  ).join('');

  openModal(
    record ? 'Edit Earth Pit Record' : 'Add Earth Pit',
    '<div id="modal-form-error"></div>'
    + '<div class="field-row">'
    + '<div class="field"><label>S. No.</label><input type="text" id="ep-sno-input" value="'+escapeHtml(record?record.sNo:'')+'"></div>'
    + '<div class="field"><label>Earth Pit No.</label><input type="text" id="ep-pitno-input" value="'+escapeHtml(record?record.pitNo:'')+'"></div>'
    + '</div>'
    + '<div class="field"><label>Earth Resistance Value (&Omega;)</label><input type="text" id="ep-resistance-input" value="'+escapeHtml(record?record.resistanceValue:'')+'"></div>'
    + '<div class="field-row">'
    + '<div class="field"><label>Testing Date</label><input type="date" id="ep-testingdate-input" value="'+(record?record.testingDate||'':'')+'"></div>'
    + '<div class="field"><label>Due Date</label><input type="date" id="ep-duedate-input" value="'+(record?record.dueDate||'':'')+'"></div>'
    + '</div>'
    + statusFieldsHtml,
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Save</button>'
  );
  document.querySelector('#modal-overlay .modal').style.maxWidth = '540px';
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const testingDate = document.getElementById('ep-testingdate-input').value;
    const dueDate = document.getElementById('ep-duedate-input').value;
    const errBox = document.getElementById('modal-form-error');
    if(testingDate && dueDate && dueDate < testingDate){
      errBox.innerHTML = '<div class="form-error">Due Date cannot be earlier than Testing Date.</div>';
      return;
    }
    const fields = {
      sNo: document.getElementById('ep-sno-input').value.trim(),
      pitNo: document.getElementById('ep-pitno-input').value.trim(),
      resistanceValue: document.getElementById('ep-resistance-input').value.trim(),
      testingDate, dueDate
    };
    EARTHPIT_STATUS_FIELDS.forEach(f=>{ fields[f.key] = document.getElementById('ep-'+f.key+'-input').value; });
    try {
      if(record){ Object.assign(record, fields); }
      else { DB.earthPitRecords.push(Object.assign({ id: nextId('epr'), stationId, yearId, createdAt: new Date().toISOString() }, fields)); }
      await saveDb();
      closeModal();
      toast('Earth pit reading saved.', 'success');
      renderEarthPitRegister(stationId, yearId);
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; }
  });
}

function openSLDUploadModal(stationId, existing){
  openModal(
    existing ? 'Replace Single Line Diagram' : 'Upload Single Line Diagram',
    '<div id="modal-form-error"></div>'
    + '<div class="field"><label>Drawing Name</label><input type="text" id="sld-title-input" value="'+(existing?escapeHtml(existing.title):'')+'" placeholder="e.g. Station SLD Rev 3"></div>'
    + '<div class="field"><label>File (JPG, JPEG, PNG)</label><input type="file" id="sld-file-input" accept=".jpg,.jpeg,.png"></div>'
    + (existing ? '<div class="helper-text">Uploading a new file will replace the current SLD.</div>' : ''),
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">'+(existing?'Replace':'Upload')+'</button>'
  );
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const title = document.getElementById('sld-title-input').value.trim();
    const fileInput = document.getElementById('sld-file-input');
    const errBox = document.getElementById('modal-form-error');
    if(!fileInput.files.length){ errBox.innerHTML = '<div class="form-error">Please choose a file.</div>'; return; }
    const file = fileInput.files[0];
    const ext = getExtension(file.name);
    if(!SLD_EXTENSIONS.includes(ext)){ errBox.innerHTML = '<div class="form-error">File must be JPG, JPEG, or PNG.</div>'; return; }
    const saveBtn = document.getElementById('modal-save-btn');
    saveBtn.disabled = true; saveBtn.textContent = 'Uploading\u2026';
    try {
      const fileId = await driveUploadBinary(file, CONFIG.UPLOADS_FOLDER_ID);
      await driveSetPublicReadable(fileId);
      const oldFileId = existing ? existing.fileId : null;
      DB.stationSLD = DB.stationSLD.filter(s=>s.stationId!==stationId);
      DB.stationSLD.push({ id: nextId('sld'), stationId, title: title||file.name, fileId, originalName: file.name, sizeBytes: file.size, uploadedAt: new Date().toISOString(), uploadedBy: currentUserEmail||'admin' });
      await saveDb();
      if(oldFileId) driveDeleteFile(oldFileId);
      closeModal();
      toast(existing ? 'SLD replaced.' : 'SLD uploaded.', 'success');
      renderSLDTab(stationId);
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; saveBtn.disabled=false; saveBtn.textContent=existing?'Replace':'Upload'; }
  });
}

async function deleteSLD(stationId, sld){
  if(!confirm('Delete the Single Line Diagram for this station?')) return;
  try {
    DB.stationSLD = DB.stationSLD.filter(s=>s.id!==sld.id);
    await saveDb();
    if(sld.fileId) driveDeleteFile(sld.fileId);
    toast('SLD deleted.', 'success');
    renderSLDTab(stationId);
  } catch(e){ toast(e.message, 'error'); }
}

function panel_wireSafetyDocButtons(docs){

    .map(s=>'<option value="'+s.id+'" '+(glove&&glove.stationId===s.id?'selected':'')+'>'+escapeHtml(s.name)+'</option>').join('');

    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Save</button>'

    const stationId = document.getElementById('glove-station-input').value;

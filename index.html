    + '</div>'
    + (records.length===0
      ? '<div class="empty-state"><h3>No breakdown history</h3><p>'+(admin?'Log the first incident above.':'No breakdowns have been recorded for this equipment.')+'</p></div>'
      : '<table class="data-table"><thead><tr><th>Date</th><th>Description</th><th>Downtime (hrs)</th><th>Root Cause</th><th>Action Taken</th><th>Restored On</th><th>Image</th>'+(admin?'<th></th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>');

  panel.querySelectorAll('[data-breakdown-image]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const rec = records.find(r=>r.id===img.dataset.breakdownImage);
      openPreviewModal({ kind:'drive-image', url:driveViewUrl(rec.imageFileId), title:'Breakdown photo' });
    });
  });

  if(admin){
    document.getElementById('add-bd-btn').addEventListener('click', ()=>openBreakdownModal(equipmentId));
    panel.querySelectorAll('[data-bd-edit]').forEach(btn=>btn.addEventListener('click', ()=>{
      const rec = records.find(r=>r.id===btn.dataset.bdEdit);
      openBreakdownModal(equipmentId, rec);
    }));
    panel.querySelectorAll('[data-bd-delete]').forEach(btn=>btn.addEventListener('click', ()=>deleteBreakdown(btn.dataset.bdDelete, equipmentId)));
  }
}

function openBreakdownModal(equipmentId, record){
  openModal(
    record ? 'Edit Breakdown Record' : 'Add Breakdown Record',
    '<div id="modal-form-error"></div>'
    + '<div class="field-row"><div class="field"><label>Breakdown date</label><input type="date" id="bf-date" value="'+(record?record.date:'')+'"></div>'
    + '<div class="field"><label>Downtime (hours)</label><input type="text" id="bf-downtime" value="'+escapeHtml(record?record.downtimeHours:'')+'"></div></div>'
    + '<div class="field"><label>Description</label><textarea id="bf-description">'+escapeHtml(record?record.description:'')+'</textarea></div>'
    + '<div class="field"><label>Root cause</label><input type="text" id="bf-rootcause" value="'+escapeHtml(record?record.rootCause:'')+'"></div>'
    + '<div class="field"><label>Action taken</label><textarea id="bf-action">'+escapeHtml(record?record.actionTaken:'')+'</textarea></div>'
    + '<div class="field"><label>Restored on (leave blank if still open)</label><input type="date" id="bf-restored" value="'+(record?record.restoredOn||'':'')+'"></div>'
    + '<div class="field"><label>Attach Image (JPG, JPEG, PNG)</label>'
    + (record && record.imageFileId ? '<div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;"><img src="'+driveViewUrl(record.imageFileId)+'" alt="Current attachment" style="width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--color-border);"><label style="font-weight:400; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="bf-remove-image"> Remove current image</label></div>' : '')
    + '<input type="file" id="bf-image" accept=".jpg,.jpeg,.png"></div>',
    '<button class="btn btn-outline" id="modal-cancel-btn">Cancel</button><button class="btn btn-primary" id="modal-save-btn">Save</button>'
  );
  document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-save-btn').addEventListener('click', async ()=>{
    const date = document.getElementById('bf-date').value;
    const description = document.getElementById('bf-description').value.trim();
    const errBox = document.getElementById('modal-form-error');
    if(!date || !description){ errBox.innerHTML = '<div class="form-error">Date and description are required.</div>'; return; }
    const fileInput = document.getElementById('bf-image');
    const removeCheckbox = document.getElementById('bf-remove-image');
    const saveBtn = document.getElementById('modal-save-btn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
    try {
      let imageFileId = record ? record.imageFileId||'' : '';
      let imageOriginalName = record ? record.imageOriginalName||'' : '';
      if(fileInput.files.length){
        if(imageFileId) driveDeleteFile(imageFileId);
        const file = fileInput.files[0];
        const ext = getExtension(file.name);
        if(!['jpg','jpeg','png'].includes(ext)) throw new Error('Image must be JPG, JPEG, or PNG.');
        imageFileId = await driveUploadBinary(file, CONFIG.UPLOADS_FOLDER_ID);
        await driveSetPublicReadable(imageFileId);
        imageOriginalName = file.name;
      } else if(removeCheckbox && removeCheckbox.checked){
        if(imageFileId) driveDeleteFile(imageFileId);
        imageFileId = ''; imageOriginalName = '';
      }
      const fields = {
        date, description,
        downtimeHours: document.getElementById('bf-downtime').value,
        rootCause: document.getElementById('bf-rootcause').value,
        actionTaken: document.getElementById('bf-action').value,
        restoredOn: document.getElementById('bf-restored').value,
        imageFileId, imageOriginalName
      };
      if(record){ Object.assign(record, fields); }
      else { DB.breakdownHistory.push(Object.assign({ id: nextId('bdn'), equipmentId, recordedBy: currentUserEmail||'admin', createdAt: new Date().toISOString() }, fields)); }
      await saveDb();
      closeModal();
      toast('Breakdown record saved.', 'success');
      renderBreakdown(equipmentId);
    } catch(e){ errBox.innerHTML = '<div class="form-error">'+escapeHtml(e.message)+'</div>'; saveBtn.disabled=false; saveBtn.textContent='Save'; }
  });
}

async function deleteBreakdown(id, equipmentId){
  if(!confirm('Delete this breakdown record?')) return;
  const rec = DB.breakdownHistory.find(b=>b.id===id);
  try {
    DB.breakdownHistory = DB.breakdownHistory.filter(b=>b.id!==id);
    await saveDb();
    if(rec && rec.imageFileId) driveDeleteFile(rec.imageFileId);
    toast('Record deleted.', 'success');
    renderBreakdown(equipmentId);
  } catch(e){ toast(e.message, 'error'); }
}

/* ============================================================
   FIRST-RUN SETUP SCREEN (shown until CONFIG.DB_FILE_ID is set)
   ============================================================ */
function renderSetupScreen(){
  const app = document.getElementById('app');
  if(!CONFIG.DRIVE_API_KEY || CONFIG.DRIVE_API_KEY.startsWith('PASTE_')){
    app.innerHTML = '<div class="setup-box"><h1>Setup needed</h1>'
      + '<p>Before this page will work, open this HTML file in a text editor and fill in the <code>CONFIG</code> section near the top of the <code>&lt;script&gt;</code> block with your Google Drive API key and OAuth Client ID.</p>'
      + '<p>See the accompanying setup guide for exact steps.</p></div>';
    return;
  }
  app.innerHTML = '<div class="setup-box"><h1>One-time portal setup</h1>'
    + '<p>This copy of the portal has an API key and OAuth Client ID, but hasn\u2019t created its data file on Google Drive yet.</p>'
    + '<p>Sign in with the Google account that should own the portal\u2019s data, then click the button below. This will create a folder and a data file in <strong>your</strong> Google Drive, make them viewable by anyone with the link, and show you two IDs to paste back into this file\u2019s <code>CONFIG</code> section.</p>'
    + '<div style="display:flex; gap:10px; margin-top:20px;">'
    + '<button class="btn btn-ghost-light" style="background:var(--color-panel); color:#fff;" id="setup-login-btn">Sign in with Google</button>'
    + '<button class="btn btn-primary" id="setup-init-btn" disabled>Initialize Portal Data</button>'
    + '</div><div id="setup-status" style="margin-top:16px;"></div></div>';

  document.getElementById('setup-login-btn').addEventListener('click', ()=>{
    if(!tokenClient){ toast('Still loading Google sign-in, try again in a second.', 'error'); return; }
    tokenClient.requestAccessToken({ prompt: 'consent' });
  });

  // Poll for token acquisition (simplest approach without restructuring the callback above).
  const statusBox = document.getElementById('setup-status');
  const initBtn = document.getElementById('setup-init-btn');
  const poll = setInterval(()=>{
    if(accessToken){
      clearInterval(poll);
      initBtn.disabled = false;
      statusBox.innerHTML = '<p style="color:var(--color-success);">Signed in as '+escapeHtml(currentUserEmail||'')+'. Ready to initialize.</p>';
    }
  }, 400);

  initBtn.addEventListener('click', async ()=>{
    initBtn.disabled = true; initBtn.textContent = 'Creating\u2026';
    try {
      const folderId = await driveCreateFolder('EMD Electrical Maintenance Portal Files');
      const seedData = emptyDb();
      SEED_STATIONS.forEach((name,i)=>seedData.stations.push({ id: nextId('stn'), name, sortOrder:i, createdAt:new Date().toISOString() }));
      const dbFileId = await driveCreateJsonFile('emd-portal-db.json', folderId, seedData);
      await driveSetPublicReadable(dbFileId);
      await driveSetPublicReadable(folderId);
      statusBox.innerHTML = '<p style="color:var(--color-success); font-weight:600;">Done! Copy these two values into the CONFIG section at the top of this HTML file\u2019s &lt;script&gt; block, save, and reload the page:</p>'
        + '<pre>DB_FILE_ID: "'+dbFileId+'",\nUPLOADS_FOLDER_ID: "'+folderId+'"</pre>';
    } catch(e){
      statusBox.innerHTML = '<div class="form-error">Setup failed: '+escapeHtml(e.message)+'</div>';
      initBtn.disabled = false; initBtn.textContent = 'Initialize Portal Data';
    }
  });
}

/* ============================================================
   Boot
   ============================================================ */
async function boot(){
  renderTopbar();
  renderFooter();
  initAuth();
  if(!CONFIG.DB_FILE_ID){ renderSetupScreen(); return; }
  try {
    await loadDb();
    renderRoute();
  } catch(e){
    document.getElementById('app').innerHTML = '<div class="empty-state"><h3>Could not load portal data</h3><p>'+escapeHtml(e.message)+'</p></div>';
  }
}
boot();
</script>
